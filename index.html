<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>推しログ | OshiLog - 推し活を記録して楽しもう</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Inter:wght@400;500;600&display=swap');
        
        :root { --accent: #ec4899; }
        body { font-family: 'Noto Sans JP', 'Inter', system-ui, sans-serif; -webkit-tap-highlight-color: transparent; }
        .activity-card { transition: transform 0.2s ease, box-shadow 0.2s ease; }
        .activity-card:hover { transform: translateY(-2px); box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1); }
        .modal { animation: modalPop 0.2s ease forwards; }
        @keyframes modalPop { from { opacity: 0; transform: scale(0.95) translateY(10px); } to { opacity: 1; transform: scale(1) translateY(0); } }
        .section { display: none; }
        .section.active { display: block; }
        .star { cursor: pointer; transition: transform 0.1s ease; }
        .star:hover { transform: scale(1.2); }
        .log-row { transition: background-color 0.1s ease; }
        .log-row:hover { background-color: #fdf2f8; }
        .metric-value { font-variant-numeric: tabular-nums; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-zinc-50 text-zinc-800">
    <header class="bg-white border-b border-zinc-200 sticky top-0 z-50 shadow-sm">
        <div class="max-w-5xl mx-auto px-4 py-4 flex items-center justify-between">
            <div class="flex items-center gap-x-3">
                <div class="w-11 h-11 bg-gradient-to-br from-pink-500 to-rose-500 rounded-2xl flex items-center justify-center shadow-lg shadow-pink-200">
                    <i class="fa-solid fa-heart text-white text-2xl"></i>
                </div>
                <div>
                    <h1 class="text-2xl font-bold tracking-tight">推しログ</h1>
                    <p class="text-[10px] text-zinc-500 -mt-1 font-medium">OshiLog</p>
                </div>
            </div>
            
            <div class="flex items-center gap-x-2">
                <div class="relative">
                    <select id="oshi-selector" class="appearance-none bg-white border border-zinc-200 rounded-2xl pl-4 pr-10 py-2 text-sm font-medium focus:outline-none focus:ring-2 focus:ring-pink-200 cursor-pointer" onchange="switchOshi()"></select>
                    <i class="fa-solid fa-chevron-down absolute right-3 top-3 text-zinc-400 text-xs pointer-events-none"></i>
                </div>
                <button onclick="showAddOshiModal()" class="flex items-center gap-x-1.5 px-3 py-2 text-sm font-medium text-pink-600 hover:bg-pink-50 rounded-2xl transition-colors">
                    <i class="fa-solid fa-plus"></i><span class="hidden sm:inline">推しを追加</span>
                </button>
            </div>
        </div>
    </header>

    <div class="max-w-5xl mx-auto px-4 py-6 pb-28">
        
        <div id="section-home" class="section active">
            <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
                <div class="lg:col-span-5">
                    <div class="bg-white rounded-3xl p-6 shadow-sm border border-zinc-100 h-full relative overflow-hidden">
                        <div class="absolute top-0 right-0 w-32 h-32 bg-pink-50 rounded-bl-full -z-10 opacity-50"></div>
                        <div class="flex items-start justify-between mb-4">
                            <div class="flex items-start gap-x-4">
                                <div id="home-oshi-emoji" class="w-20 h-20 sm:w-24 sm:h-24 flex-shrink-0 flex items-center justify-center text-5xl bg-zinc-50 border border-zinc-100 rounded-3xl shadow-sm overflow-hidden"></div>
                                <div class="pt-1">
                                    <h2 id="home-oshi-name" class="text-2xl sm:text-3xl font-bold tracking-tight text-zinc-800"></h2>
                                    <p id="home-oshi-group" class="text-sm text-zinc-500 mt-1 font-medium"></p>
                                </div>
                            </div>
                            <div class="text-right flex-shrink-0">
                                <div class="text-[10px] font-bold text-zinc-400 uppercase tracking-wider">推し歴</div>
                                <div id="home-oshi-days" class="text-xl sm:text-2xl font-bold text-pink-600 mt-0.5"></div>
                            </div>
                        </div>
                        <div class="flex items-center gap-x-2 text-sm mt-6">
                            <div class="px-3 py-1.5 bg-pink-50/80 text-pink-600 rounded-xl text-xs font-semibold flex items-center gap-x-1.5 border border-pink-100/50">
                                <i class="fa-solid fa-cake-candles"></i><span id="home-oshi-birthday"></span>
                            </div>
                            <div onclick="showSection('settings')" class="cursor-pointer text-xs px-3 py-1.5 bg-zinc-50 hover:bg-zinc-100 border border-zinc-100 rounded-xl flex items-center gap-x-1.5 text-zinc-500 font-medium transition-colors">
                                <i class="fa-solid fa-edit"></i><span>編集</span>
                            </div>
                        </div>
                    </div>
                </div>
                
                <div class="lg:col-span-7">
                    <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 h-full">
                        <div class="bg-white rounded-3xl p-4 sm:p-5 border border-zinc-100 shadow-sm flex flex-col justify-center min-w-0">
                            <div class="text-xs text-zinc-500 mb-1 font-medium truncate">総活動回数</div>
                            <div class="flex items-baseline gap-x-1 overflow-x-auto hide-scrollbar whitespace-nowrap"><div id="stat-total-activities" class="text-2xl lg:text-3xl font-bold metric-value">0</div><div class="text-emerald-500 text-xs font-bold">回</div></div>
                        </div>
                        <div class="bg-white rounded-3xl p-4 sm:p-5 border border-zinc-100 shadow-sm flex flex-col justify-center min-w-0">
                            <div class="text-xs text-zinc-500 mb-1 font-medium truncate">総支出</div>
                            <div class="flex items-baseline gap-x-1 overflow-x-auto hide-scrollbar whitespace-nowrap"><div id="stat-month-total-spent" class="text-2xl lg:text-3xl font-bold metric-value">0</div><div class="text-rose-500 text-xs font-bold">円</div></div>
                        </div>
                        <div class="bg-white rounded-3xl p-4 sm:p-5 border border-zinc-100 shadow-sm flex flex-col justify-center min-w-0">
                            <div class="text-xs text-zinc-500 mb-1 font-medium truncate">今月の活動</div>
                            <div class="flex items-baseline gap-x-1 overflow-x-auto hide-scrollbar whitespace-nowrap"><div id="stat-month-activities" class="text-2xl lg:text-3xl font-bold metric-value">0</div><div class="text-emerald-500 text-xs font-bold">回</div></div>
                        </div>
                        <div class="bg-white rounded-3xl p-4 sm:p-5 border border-zinc-100 shadow-sm flex flex-col justify-center min-w-0">
                            <div class="text-xs text-zinc-500 mb-1 font-medium truncate">今月の支出</div>
                            <div class="flex items-baseline gap-x-1 overflow-x-auto hide-scrollbar whitespace-nowrap"><div id="stat-month-spent" class="text-2xl lg:text-3xl font-bold metric-value">0</div><div class="text-rose-500 text-xs font-bold">円</div></div>
                        </div>
                    </div>
                </div>
                
                <div class="lg:col-span-12 mt-2">
                    <div class="flex items-center justify-between mb-4 px-1">
                        <h3 class="font-bold text-lg flex items-center gap-x-2 text-zinc-800">
                            <i class="fa-solid fa-clock-rotate-left text-pink-500"></i><span>最近の推し活</span>
                        </h3>
                        <button onclick="showSection('logs')" class="text-sm text-pink-600 hover:text-pink-700 font-bold flex items-center gap-x-1 transition-colors bg-pink-50 px-3 py-1.5 rounded-full">
                            すべて見る <i class="fa-solid fa-arrow-right text-xs"></i>
                        </button>
                    </div>
                    <div id="recent-logs" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"></div>
                </div>
            </div>
        </div>
        
        <div id="section-add" class="section">
            <div class="max-w-2xl mx-auto">
                <div class="bg-white rounded-3xl p-6 sm:p-8 shadow-sm border border-zinc-100">
                    <h2 class="text-xl font-bold mb-6 flex items-center gap-x-3 text-zinc-800">
                        <i class="fa-solid fa-plus-circle text-pink-500"></i><span>新しい活動を記録する</span>
                    </h2>
                    
                    <form id="add-activity-form" onsubmit="addActivity(event)">
                        <div class="space-y-6">
                            <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
                                <div>
                                    <label class="block text-sm font-bold text-zinc-700 mb-2">日付</label>
                                    <input type="date" id="activity-date" required class="w-full px-4 py-3 bg-zinc-50 border border-zinc-200 rounded-2xl focus:outline-none focus:ring-2 focus:ring-pink-200 focus:bg-white text-sm font-mono transition-all">
                                </div>
                                <div>
                                    <label class="block text-sm font-bold text-zinc-700 mb-2">活動の種類</label>
                                    <select id="activity-type" required class="w-full px-4 py-3 bg-zinc-50 border border-zinc-200 rounded-2xl focus:outline-none focus:ring-2 focus:ring-pink-200 focus:bg-white text-sm transition-all"></select>
                                </div>
                            </div>
                            
                            <div>
                                <label class="block text-sm font-bold text-zinc-700 mb-2">タイトル・内容</label>
                                <input type="text" id="activity-title" required placeholder="例: 東京ドームライブ 1日目" class="w-full px-4 py-3 bg-zinc-50 border border-zinc-200 rounded-2xl focus:outline-none focus:ring-2 focus:ring-pink-200 focus:bg-white text-sm transition-all">
                            </div>

                            <div class="flex items-center gap-x-2 bg-pink-50/50 p-3.5 rounded-2xl border border-pink-100/50">
                                <input type="checkbox" id="activity-is-planned" class="w-4 h-4 accent-pink-600 rounded" onchange="togglePlannedMode(this.checked, 'add')">
                                <label for="activity-is-planned" class="text-sm font-bold text-pink-800">これは予定です（未来の活動）</label>
                            </div>
                            
                            <div class="bg-zinc-50/50 p-5 rounded-3xl border border-zinc-100 space-y-5" id="add-details-container">
                                <div class="text-sm font-bold text-zinc-800 border-b border-zinc-200 pb-2 flex items-center gap-x-2">
                                    <i class="fa-solid fa-coins text-zinc-400"></i>支出の内訳（円）
                                </div>
                                <div class="grid grid-cols-2 sm:grid-cols-4 gap-4">
                                    <div>
                                        <label class="block text-[11px] font-bold text-zinc-500 mb-1.5 uppercase tracking-wider">チケット等</label>
                                        <input type="number" id="act-amt-ticket" value="0" min="0" class="w-full px-3 py-2.5 bg-white border border-zinc-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-pink-200 text-sm font-mono transition-all">
                                    </div>
                                    <div>
                                        <label class="block text-[11px] font-bold text-zinc-500 mb-1.5 uppercase tracking-wider">ホテル代</label>
                                        <input type="number" id="act-amt-hotel" value="0" min="0" class="w-full px-3 py-2.5 bg-white border border-zinc-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-pink-200 text-sm font-mono transition-all">
                                    </div>
                                    <div>
                                        <label class="block text-[11px] font-bold text-zinc-500 mb-1.5 uppercase tracking-wider">交通費</label>
                                        <input type="number" id="act-amt-transport" value="0" min="0" class="w-full px-3 py-2.5 bg-white border border-zinc-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-pink-200 text-sm font-mono transition-all">
                                    </div>
                                    <div>
                                        <label class="block text-[11px] font-bold text-zinc-500 mb-1.5 uppercase tracking-wider">その他</label>
                                        <input type="number" id="act-amt-other" value="0" min="0" class="w-full px-3 py-2.5 bg-white border border-zinc-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-pink-200 text-sm font-mono transition-all">
                                    </div>
                                </div>
                                <div class="pt-3 border-t border-zinc-200/60">
                                    <label class="block text-[11px] font-bold text-zinc-500 mb-2 uppercase tracking-wider">満足度</label>
                                    <div class="flex items-center gap-x-1 transition-opacity" id="rating-stars"></div>
                                    <input type="hidden" id="activity-rating" value="5">
                                </div>
                            </div>
                            
                            <div>
                                <label class="block text-sm font-bold text-zinc-700 mb-2">メモ・感想</label>
                                <textarea id="activity-memo" rows="3" placeholder="推しが尊かった..." class="w-full px-4 py-3 bg-zinc-50 border border-zinc-200 rounded-2xl focus:outline-none focus:ring-2 focus:ring-pink-200 focus:bg-white text-sm resize-y transition-all"></textarea>
                            </div>

                            <div class="bg-zinc-50/50 p-4 rounded-2xl border border-zinc-100">
                                <div class="flex items-center justify-between mb-3">
                                    <label class="block text-sm font-bold text-zinc-700">関連リンク（任意）</label>
                                    <button type="button" onclick="addLinkToCurrentActivity()" class="text-xs px-3 py-1.5 bg-white border border-zinc-200 shadow-sm text-zinc-600 hover:text-pink-600 hover:border-pink-200 rounded-xl font-bold transition-colors">
                                        <i class="fa-solid fa-plus mr-1"></i>追加
                                    </button>
                                </div>
                                <div id="activity-links-preview" class="space-y-2"></div>
                            </div>
                        </div>
                        
                        <div class="mt-8 flex gap-x-3">
                            <button type="button" onclick="showSection('home')" class="flex-1 py-3.5 rounded-2xl bg-zinc-100 hover:bg-zinc-200 text-zinc-700 font-bold text-sm transition-colors">キャンセル</button>
                            <button type="submit" class="flex-[2] py-3.5 bg-pink-600 hover:bg-pink-700 transition-colors text-white rounded-2xl font-bold text-sm flex items-center justify-center gap-x-2 shadow-sm shadow-pink-200">
                                <i class="fa-solid fa-check"></i><span>記録を保存する</span>
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
        
        <div id="section-logs" class="section">
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-y-3 mb-5 px-1">
                <h2 class="text-xl font-bold flex items-center gap-x-2 text-zinc-800">
                    <i class="fa-solid fa-list text-pink-500"></i><span>活動一覧</span>
                </h2>
                <div class="flex gap-x-2">
                    <div class="relative flex-1 sm:w-64">
                        <input type="text" id="log-search" placeholder="検索..." onkeyup="filterLogs()" class="w-full pl-9 pr-4 py-2 text-sm bg-white border border-zinc-200 rounded-2xl focus:outline-none focus:ring-2 focus:ring-pink-200 shadow-sm">
                        <i class="fa-solid fa-search absolute left-3.5 top-2.5 text-zinc-400"></i>
                    </div>
                    <select id="log-filter-type" onchange="filterLogs()" class="px-3 py-2 text-sm bg-white border border-zinc-200 rounded-2xl focus:outline-none shadow-sm font-medium"></select>
                </div>
            </div>
            
            <div class="bg-white rounded-3xl border border-zinc-100 overflow-hidden shadow-sm">
                <div id="logs-list" class="divide-y divide-zinc-100/80 max-h-[650px] overflow-auto hide-scrollbar"></div>
            </div>
        </div>
        
        <div id="section-lotteries" class="section">
            <div class="flex items-center justify-between mb-5 px-1">
                <h2 class="text-xl font-bold flex items-center gap-x-2 text-zinc-800">
                    <i class="fa-solid fa-ticket text-pink-500"></i><span>当落管理</span>
                </h2>
                <button onclick="showLotteryModal()" class="px-4 py-2 bg-white border border-pink-200 hover:bg-pink-50 text-pink-600 text-sm font-bold rounded-2xl flex items-center gap-x-2 transition-colors shadow-sm">
                    <i class="fa-solid fa-plus"></i><span>新規登録</span>
                </button>
            </div>

            <div class="bg-white p-5 rounded-3xl mb-5 border border-zinc-100 shadow-sm">
                <div class="grid grid-cols-3 gap-3 mb-4">
                    <select id="lottery-filter-year" onchange="renderLotteries()" class="w-full px-3 py-2 text-xs font-bold bg-zinc-50 border border-zinc-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-pink-200"></select>
                    <select id="lottery-filter-type" onchange="renderLotteries()" class="w-full px-3 py-2 text-xs font-bold bg-zinc-50 border border-zinc-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-pink-200"></select>
                    <select id="lottery-filter-place" onchange="renderLotteries()" class="w-full px-3 py-2 text-xs font-bold bg-zinc-50 border border-zinc-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-pink-200"></select>
                </div>
                <div class="text-center bg-gradient-to-br from-zinc-50 to-pink-50/30 border border-zinc-100 rounded-2xl py-5 shadow-inner">
                    <div class="text-[11px] font-bold text-zinc-500 uppercase tracking-widest mb-1">戦績（結果待ち除く）</div>
                    <div class="text-2xl sm:text-3xl font-black text-zinc-800 tracking-tight overflow-x-auto hide-scrollbar whitespace-nowrap pb-1" id="lottery-stats-text">0<span class="text-sm sm:text-base font-bold text-zinc-400 mx-1">戦</span>0<span class="text-sm sm:text-base font-bold text-zinc-400 mx-1">勝</span><span class="text-xl sm:text-2xl ml-2 text-pink-600">0%</span></div>
                </div>
            </div>

            <div id="lotteries-list" class="space-y-3 pb-4"></div>
        </div>

        <div id="section-stats" class="section">
            <h2 class="text-xl font-bold mb-5 px-1 flex items-center gap-x-2 text-zinc-800">
                <i class="fa-solid fa-chart-line text-pink-500"></i><span>推し活統計</span>
            </h2>
            
            <div class="grid grid-cols-2 md:grid-cols-4 gap-3 sm:gap-4 mb-6">
                <div class="bg-white p-4 sm:p-5 rounded-3xl border border-zinc-100 shadow-sm flex flex-col justify-center min-w-0">
                    <div class="text-[11px] font-bold text-zinc-500 uppercase tracking-wider truncate">総実績回数</div>
                    <div id="stats-total-count" class="text-2xl lg:text-3xl font-black mt-1 metric-value text-zinc-800 overflow-x-auto hide-scrollbar whitespace-nowrap">0</div>
                </div>
                <div class="bg-white p-4 sm:p-5 rounded-3xl border border-zinc-100 shadow-sm flex flex-col justify-center min-w-0">
                    <div class="text-[11px] font-bold text-zinc-500 uppercase tracking-wider mb-1 truncate">総支出額</div>
                    <div id="stats-total-spent" class="w-full overflow-hidden"></div>
                </div>
                <div class="bg-white p-4 sm:p-5 rounded-3xl border border-zinc-100 shadow-sm flex flex-col justify-center min-w-0">
                    <div class="text-[11px] font-bold text-zinc-500 uppercase tracking-wider truncate">平均満足度</div>
                    <div id="stats-avg-rating" class="text-2xl lg:text-3xl font-black mt-1 flex items-baseline text-zinc-800 overflow-x-auto hide-scrollbar whitespace-nowrap">0 <span class="text-base ml-1 text-yellow-500">★</span></div>
                </div>
                <div class="bg-white p-4 sm:p-5 rounded-3xl border border-zinc-100 shadow-sm flex flex-col justify-center min-w-0">
                    <div class="text-[11px] font-bold text-zinc-500 uppercase tracking-wider truncate">推し活日数</div>
                    <div id="stats-oshi-days" class="text-2xl lg:text-3xl font-black mt-1 metric-value text-zinc-800 overflow-x-auto hide-scrollbar whitespace-nowrap">0</div>
                </div>
            </div>
            
            <div class="grid grid-cols-1 lg:grid-cols-5 gap-6">
                <div class="lg:col-span-3 bg-white rounded-3xl p-6 border border-zinc-100 shadow-sm">
                    <h4 class="font-bold mb-4 text-sm flex items-center gap-x-2 text-zinc-800">
                        <i class="fa-solid fa-chart-bar text-pink-400"></i><span>月別支出推移</span>
                    </h4>
                    <div class="h-72"><canvas id="monthly-chart"></canvas></div>
                </div>
                <div class="lg:col-span-2 bg-white rounded-3xl p-6 border border-zinc-100 shadow-sm">
                    <h4 class="font-bold mb-4 text-sm flex items-center gap-x-2 text-zinc-800">
                        <i class="fa-solid fa-chart-pie text-pink-400"></i><span>活動種別内訳</span>
                    </h4>
                    <div class="h-72 flex items-center justify-center"><canvas id="type-pie-chart"></canvas></div>
                </div>
            </div>
        </div>
        
        <div id="section-wishlist" class="section">
            <div class="flex items-center justify-between mb-5 px-1">
                <h2 class="text-xl font-bold flex items-center gap-x-2 text-zinc-800">
                    <i class="fa-solid fa-gift text-pink-500"></i><span>ウィッシュリスト</span>
                </h2>
                <button onclick="showWishlistEditModal()" class="px-4 py-2 bg-white border border-pink-200 hover:bg-pink-50 text-pink-600 text-sm font-bold rounded-2xl flex items-center gap-x-2 transition-colors shadow-sm">
                    <i class="fa-solid fa-plus"></i><span>追加</span>
                </button>
            </div>
            <div id="wishlist-list" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
        </div>
        
        <div id="section-links" class="section">
            <div class="flex items-center justify-between mb-5 px-1">
                <h2 class="text-xl font-bold flex items-center gap-x-2 text-zinc-800">
                    <i class="fa-solid fa-link text-pink-500"></i><span>リンク集</span>
                </h2>
                <button onclick="showLinkModal()" class="px-4 py-2 bg-white border border-pink-200 hover:bg-pink-50 text-pink-600 text-sm font-bold rounded-2xl flex items-center gap-x-2 transition-colors shadow-sm">
                    <i class="fa-solid fa-plus"></i><span>追加</span>
                </button>
            </div>
            <div id="links-list" class="space-y-3"></div>
        </div>
        
        <div id="section-settings" class="section max-w-xl mx-auto">
            <div class="bg-white rounded-3xl p-6 sm:p-8 border border-zinc-100 shadow-sm">
                <h2 class="text-xl font-bold mb-6 text-zinc-800">推し情報の編集</h2>
                <div class="space-y-5">
                    <div>
                        <label class="text-sm font-bold block mb-1.5 text-zinc-700">推し名</label>
                        <input type="text" id="edit-oshi-name" class="w-full px-4 py-3 bg-zinc-50 border border-zinc-200 rounded-2xl text-sm focus:ring-2 focus:ring-pink-200 focus:bg-white outline-none transition-all">

    <script>
        function escapeHTML(str) {
            if (!str) return '';
            return String(str).replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag]));
        }

        const ACTIVITY_TYPES = ['ライブ', '握手会等', 'グッズ購入', '配信・動画視聴', '映画鑑賞', '舞台鑑賞', '聖地訪問', 'ショップ訪問', 'ファンアート作成', 'その他'];
        const LOTTERY_STATUS_MAP = { waiting: '🔄 結果待ち', won: '🎉 当選', lost: '💔 落選' };

        let data = { oshis: [], activities: [], wishlist: [], links: [], lotteries: [] };
        let currentOshiId = null;
        let currentRating = 5;
        let monthlyChart = null;
        let typePieChart = null;
        let currentActivityLinks = [];
        let editingActivityLinksTemp = [];
        
        let editingActivityId = null;
        let editingLinkId = null;
        let editingWishlistId = null;
        let editingLotteryId = null;
        let pendingLotteryIdForActivity = null;

        function getTotalAmount(amounts) {
            if(!amounts) return 0;
            return (parseInt(amounts.ticket)||0) + (parseInt(amounts.hotel)||0) + (parseInt(amounts.transport)||0) + (parseInt(amounts.other)||0);
        }

        function migrateData() {
            if (!data.lotteries) data.lotteries = [];
            data.activities.forEach(a => {
                if (a.amount !== undefined) {
                    a.amounts = { ticket: a.amount, hotel: 0, transport: 0, other: 0 };
                    delete a.amount;
                }
                if (a.type === '写真撮影') a.type = '握手会等';
            });
        }

        function loadData() {
            const saved = localStorage.getItem('oshilog_data_v3');
            if (saved) {
                data = JSON.parse(saved);
                migrateData();
            } else {
                initSampleData();
            }
            if (data.oshis.length > 0 && !currentOshiId) currentOshiId = data.oshis[0].id;
            
            // Setup Type Selects
            const typeOpts = '<option value="">選択してください</option>' + ACTIVITY_TYPES.map(t => `<option value="${t}">${t}</option>`).join('');
            document.getElementById('activity-type').innerHTML = typeOpts;
            document.getElementById('lottery-type').innerHTML = typeOpts;
            document.getElementById('log-filter-type').innerHTML = '<option value="">すべての種類</option>' + ACTIVITY_TYPES.map(t => `<option value="${t}">${t}</option>`).join('');
        }
        
        function saveData() { localStorage.setItem('oshilog_data_v3', JSON.stringify(data)); }
        
        function initSampleData() {
            const sampleOshiId = Date.now().toString();
            data.oshis = [{ id: sampleOshiId, name: "推しの名前", group: "", birthday: "", started: new Date().toISOString().split('T')[0], color: "#ec4899", emoji: "❤️", iconImage: null }];
            data.activities = []; data.wishlist = []; data.links = []; data.lotteries = [];
            currentOshiId = sampleOshiId;
            saveData();
        }
        
        function getCurrentOshi() { return data.oshis.find(o => o.id === currentOshiId); }
        
        function updateOshiSelector() {
            const select = document.getElementById('oshi-selector');
            select.innerHTML = '';
            data.oshis.forEach(oshi => {
                const option = document.createElement('option');
                option.value = oshi.id; option.textContent = `${oshi.emoji || '❤️'} ${oshi.name}`;
                if (oshi.id === currentOshiId) option.selected = true;
                select.appendChild(option);
            });
        }
        
        function switchOshi() { currentOshiId = document.getElementById('oshi-selector').value; refreshAll(); }
        
        function showSection(section) {
            document.querySelectorAll('.section').forEach(el => el.classList.remove('active'));
            const target = document.getElementById('section-' + section);
            if (target) target.classList.add('active');
            
            document.querySelectorAll('.nav-btn').forEach(btn => {
                btn.classList.remove('text-pink-600'); btn.classList.add('text-zinc-400');
            });
            const activeNav = document.getElementById('nav-' + section);
            if (activeNav) {
                activeNav.classList.remove('text-zinc-400'); activeNav.classList.add('text-pink-600');
            }
            
            if (section === 'home') renderHome();
            if (section === 'logs') renderLogs();
            if (section === 'lotteries') renderLotteries();
            if (section === 'stats') renderStats();
            if (section === 'wishlist') renderWishlist();
            if (section === 'links') renderLinks();
            if (section === 'settings') loadOshiSettings();
            
            window.scrollTo(0, 0);
        }

        /* ===== HOME ===== */
        function renderHome() {
            const oshi = getCurrentOshi(); if (!oshi) return;
            document.getElementById('home-oshi-emoji').innerHTML = oshi.iconImage ? `<img src="${escapeHTML(oshi.iconImage)}" class="w-full h-full object-cover">` : escapeHTML(oshi.emoji || '❤️');
            document.getElementById('home-oshi-name').textContent = oshi.name; document.getElementById('home-oshi-group').textContent = oshi.group || '';
            const diffDays = Math.ceil(Math.abs(new Date() - new Date(oshi.started)) / (1000 * 3600 * 24));
            document.getElementById('home-oshi-days').innerHTML = `${diffDays}<span class="text-[10px] sm:text-xs font-bold text-zinc-400 ml-1">日目</span>`;
            document.getElementById('home-oshi-birthday').innerHTML = oshi.birthday ? `${new Date(oshi.birthday).getMonth() + 1}月${new Date(oshi.birthday).getDate()}日` : '未設定';
            
            const oshiActs = data.activities.filter(a => a.oshiId === currentOshiId && !a.isPlanned);
            const thisMonth = new Date().getMonth(); const thisYear = new Date().getFullYear();
            const monthActs = oshiActs.filter(a => new Date(a.date).getMonth() === thisMonth && new Date(a.date).getFullYear() === thisYear);
            
            document.getElementById('stat-total-activities').textContent = oshiActs.length;
            document.getElementById('stat-month-total-spent').textContent = oshiActs.reduce((s, a) => s + getTotalAmount(a.amounts), 0).toLocaleString();
            document.getElementById('stat-month-activities').textContent = monthActs.length;
            document.getElementById('stat-month-spent').textContent = monthActs.reduce((s, a) => s + getTotalAmount(a.amounts), 0).toLocaleString();
            
            const rc = document.getElementById('recent-logs'); rc.innerHTML = '';
            const allActs = data.activities.filter(a => a.oshiId === currentOshiId).sort((a, b) => new Date(b.date) - new Date(a.date)).slice(0, 3);
            if (!allActs.length) { rc.innerHTML = `<div class="col-span-full bg-zinc-50 border border-dashed border-zinc-200 rounded-3xl p-8 text-center text-sm font-bold text-zinc-400">まだ活動がありません</div>`; } 
            else { allActs.forEach(act => rc.appendChild(createActivityCard(act, true))); }
        }

        function createActivityCard(act, isHomeCard = false) {
            const div = document.createElement('div');
            div.className = `activity-card bg-white border border-zinc-100 rounded-2xl p-4 cursor-pointer relative ${act.isPlanned ? 'opacity-80 bg-zinc-50/50' : ''}`;
            div.onclick = () => { if (isHomeCard) { showSection('logs'); setTimeout(() => showActivityDetail(act.id), 100); } else { showActivityDetail(act.id); } };
            const dStr = `${new Date(act.date).getMonth() + 1}/${new Date(act.date).getDate()}`;
            const b = act.isPlanned ? `<span class="text-[9px] px-1.5 py-0.5 bg-zinc-200 text-zinc-600 rounded font-bold">予定</span>` : '';

        /* ===== ADD ACTIVITY ===== */
        function togglePlannedMode(isPlanned, prefix) {
            const stars = prefix === 'add' ? document.getElementById('rating-stars') : document.getElementById('edit-act-stars');
            if (stars) {
                if (isPlanned) { stars.style.opacity = '0.3'; stars.style.pointerEvents = 'none'; } 
                else { stars.style.opacity = '1'; stars.style.pointerEvents = 'auto'; }
            }
        }
        function setupRatingStars() {
            const c = document.getElementById('rating-stars'); c.innerHTML = '';
            for (let i=1; i<=5; i++) {
                const s = document.createElement('i'); s.className = `fa-solid fa-star text-2xl star ${i<=currentRating?'text-yellow-400':'text-zinc-200'}`;
                s.onclick = () => { currentRating = i; document.getElementById('activity-rating').value = i; updateRatingStars(); };
                c.appendChild(s);
            }
        }
        function updateRatingStars() { document.querySelectorAll('#rating-stars .star').forEach((s, i) => { s.className = `fa-solid fa-star text-2xl star ${i<currentRating?'text-yellow-400':'text-zinc-200'}`; }); }
        
        function addLinkToCurrentActivity() {
            const t = prompt('リンクのタイトル'); if (!t) return;

            currentActivityLinks.push({ id: 'lnk_' + Date.now(), title: t.trim(), url: u.trim() }); renderActivityLinksPreview();
        }

            const c = document.getElementById('activity-links-preview');
            c.innerHTML = currentActivityLinks.length ? currentActivityLinks.map((l, i) => `
                <div class="flex items-center justify-between bg-white border border-zinc-200 rounded-xl px-3 py-2">
                    <span class="text-sm font-medium truncate">${escapeHTML(l.title)}</span>
                    <button type="button" class="text-zinc-400 hover:text-red-500 px-2" onclick="currentActivityLinks.splice(${i},1); renderActivityLinksPreview();"><i class="fa-solid fa-times"></i></button>

        }

        function addActivity(e) {
            e.preventDefault();
            const date = document.getElementById('activity-date').value; const type = document.getElementById('activity-type').value; const title = document.getElementById('activity-title').value.trim();
            if (!date || !type || !title) return;
            const isPlanned = document.getElementById('activity-is-planned').checked;
            const amounts = {
                ticket: parseInt(document.getElementById('act-amt-ticket').value)||0, hotel: parseInt(document.getElementById('act-amt-hotel').value)||0,
                transport: parseInt(document.getElementById('act-amt-transport').value)||0, other: parseInt(document.getElementById('act-amt-other').value)||0
            };
            
            data.activities.push({
                id: 'act_' + Date.now(), oshiId: currentOshiId, date: date, type: type, title: title,
                amounts: amounts, memo: document.getElementById('activity-memo').value.trim(), rating: isPlanned ? 5 : currentRating,
                isPlanned: isPlanned, links: currentActivityLinks || []
            });
            
            if (pendingLotteryIdForActivity) {
                const l = data.lotteries.find(x => x.id === pendingLotteryIdForActivity);
                if(l) l.isLinked = true;
                pendingLotteryIdForActivity = null;
            }
            
            saveData(); document.getElementById('add-activity-form').reset(); currentRating = 5; updateRatingStars(); currentActivityLinks = []; renderActivityLinksPreview(); togglePlannedMode(false, 'add');
            showToast('活動を記録しました'); setTimeout(() => showSection('logs'), 300);

        /* ===== LOTTERIES (当落管理) ===== */
        function getLotteryPlaces() { const p = new Set(); data.lotteries.filter(l => l.oshiId === currentOshiId).forEach(l => { if(l.place) p.add(l.place); }); return Array.from(p).sort(); }
        function getLotteryYears() { const y = new Set(); data.lotteries.filter(l => l.oshiId === currentOshiId).forEach(l => { if(l.date) y.add(l.date.substring(0,4)); }); return Array.from(y).sort().reverse(); }
        
        function renderLotteries() {
            // Update Filters Options dynamically based on data
            const ySel = document.getElementById('lottery-filter-year'); const curY = ySel.value;
            ySel.innerHTML = '<option value="">全期間</option>' + getLotteryYears().map(y => `<option value="${y}">${y}年</option>`).join('');
            if(curY && getLotteryYears().includes(curY)) ySel.value = curY;
            
            const pSel = document.getElementById('lottery-filter-place'); const curP = pSel.value;
            pSel.innerHTML = '<option value="">すべての場所</option>' + getLotteryPlaces().map(p => `<option value="${escapeHTML(p)}">${escapeHTML(p)}</option>`).join('');
            if(curP && getLotteryPlaces().includes(curP)) pSel.value = curP;

            const tSel = document.getElementById('lottery-filter-type'); if(tSel.options.length<=1) { tSel.innerHTML = '<option value="">すべての種類</option>' + ACTIVITY_TYPES.map(t => `<option value="${t}">${t}</option>`).join(''); }

            // Filter logic
            const yFil = ySel.value; const tFil = tSel.value; const pFil = pSel.value;
            const myLots = data.lotteries.filter(l => l.oshiId === currentOshiId);
            const filtered = myLots.filter(l => (!yFil || l.date.startsWith(yFil)) && (!tFil || l.type === tFil) && (!pFil || l.place === pFil)).sort((a,b) => new Date(b.date) - new Date(a.date));

            // Stats
            const determined = filtered.filter(l => l.status !== 'waiting');
            const won = determined.filter(l => l.status === 'won').length;
            const rate = determined.length ? Math.round((won / determined.length) * 100) : 0;
            document.getElementById('lottery-stats-text').innerHTML = `${determined.length}<span class="text-sm sm:text-base font-bold text-zinc-400 mx-1">戦</span>${won}<span class="text-sm sm:text-base font-bold text-zinc-400 mx-1">勝</span><span class="text-xl sm:text-2xl font-black ml-2 text-pink-600">${rate}%</span>`;

            const c = document.getElementById('lotteries-list'); c.innerHTML = '';
            if(!filtered.length) { c.innerHTML = `<div class="p-8 text-center text-zinc-400 font-bold text-sm bg-white rounded-3xl border border-zinc-100">データがありません</div>`; return; }

            filtered.forEach(l => {
                const row = document.createElement('div');
                row.className = `bg-white border border-zinc-100 rounded-2xl p-4 shadow-sm transition-all hover:shadow-md cursor-pointer ${l.status==='won'?'border-l-4 border-l-pink-400 bg-pink-50/20':l.status==='lost'?'opacity-70':''}`;

        function previewOshiImage(input) {
            if(input.files && input.files[0]) {
                const file = input.files[0];
                const r = new FileReader();
                r.onload = e => {
                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        const ctx = canvas.getContext('2d');
                        
                        // リサイズ後のサイズ (例: 256x256)
                        const targetSize = 256;
                        canvas.width = targetSize;
                        canvas.height = targetSize;
                        
                        // 中央で正方形にクロップするための計算
                        const minDim = Math.min(img.width, img.height);
                        const sx = (img.width - minDim) / 2;
                        const sy = (img.height - minDim) / 2;
                        
                        // 描画
                        ctx.drawImage(img, sx, sy, minDim, minDim, 0, 0, targetSize, targetSize);
                        
                        // 容量削減と透過維持のためWebP形式で圧縮 (品質0.8)
                        pendingOshiImage = canvas.toDataURL('image/webp', 0.8);
                        
                        document.getElementById('oshi-image-preview-img').src = pendingOshiImage;
                        document.getElementById('oshi-image-preview').classList.remove('hidden');
                    };
                    img.src = e.target.result;
                };
                r.readAsDataURL(file);
            }
        }

        function deleteCurrentOshi() {
            if(data.oshis.length<=1) return alert('最後の推しは削除できません'); if(!confirm('推しと関連データを全て削除しますか？')) return;
            data.oshis = data.oshis.filter(o=>o.id!==currentOshiId); data.activities = data.activities.filter(a=>a.oshiId!==currentOshiId); data.wishlist = data.wishlist.filter(w=>w.oshiId!==currentOshiId); data.links = data.links.filter(l=>l.oshiId!==currentOshiId); data.lotteries = data.lotteries.filter(l=>l.oshiId!==currentOshiId);
            currentOshiId = data.oshis[0].id; saveData(); refreshAll(); showSection('home');
        }
        function showAddOshiModal() {
            const n = prompt('新しい推しの名前',''); if(!n) return;
            const newO = {id:'oshi_'+Date.now(), name:n, group:'', birthday:'', started:new Date().toISOString().split('T')[0], color:'#ec4899', emoji:'❤️'};
            data.oshis.push(newO); currentOshiId = newO.id; saveData(); updateOshiSelector(); refreshAll(); showSection('settings');
        }
        
        function showToast(msg) { const t = document.getElementById('toast'); document.getElementById('toast-message').textContent = msg; t.classList.remove('hidden'); setTimeout(() => t.classList.add('hidden'), 3000); }
        function refreshAll() { updateOshiSelector(); renderHome(); renderLogs(); renderLotteries(); renderWishlist(); renderLinks(); if(document.getElementById('section-stats').classList.contains('active')) renderStats(); }
        function importData(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (ev) => {
                try {
                    const imported = JSON.parse(ev.target.result);
                    if (imported && Array.isArray(imported.oshis) && Array.isArray(imported.activities)) {
                        if(confirm('現在のデータはすべて上書きされます。インポートを実行しますか？')) {
                            data = imported;
                            migrateData();
                            saveData();
                            alert('データの復元が完了しました。');
                            location.reload();
                        }
                    } else {
                        alert('推しログのデータファイルではありません。');
                    }
                } catch (err) {
                    alert('ファイルの読み込みに失敗しました。');
                }
            };
            reader.readAsText(file);
            e.target.value = '';
        }
        function exportData() { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(data,null,2)], {type:'application/json'})); a.download = `oshilog_v3_${new Date().toISOString().slice(0,10)}.json`; a.click(); }
        function clearAllData() { if(confirm('全てのデータを削除し初期化しますか？')) { localStorage.removeItem('oshilog_data_v3'); location.reload(); } }
        
        window.onload = () => { loadData(); setupRatingStars(); document.getElementById('activity-date').value = new Date().toISOString().split('T')[0]; refreshAll(); showSection('home'); };
    </script>
</body>
</html>
